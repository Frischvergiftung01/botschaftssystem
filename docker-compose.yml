# In Coolify als "Docker Compose"-Anwendung hinterlegen.
# Kein Port-Mapping nach aussen und kein eigener Reverse Proxy - das macht Coolify.
services:
  botschaft:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PFAD=/daten/botschaften.db
      # Solange die Filterkette fehlt, geht alles direkt in die Anzeige:
      - AUTO_FREIGABE=true
      - STANDZEIT=25
      - MAX_VERSALHOEHE=40
      - MIN_VERSALHOEHE=22
    volumes:
      - botschaft-daten:/daten
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/gesundheit').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  botschaft-daten:
