# In Coolify als Ressource "Private Repository (with GitHub App)" anlegen,
# Build Pack "Docker Compose", Pfad: /docker-compose.yml
#
# Kein Port-Mapping nach aussen und kein eigener Reverse Proxy - beides macht
# Coolify. Die Umgebung steht bewusst als Zuordnung (NAME: Wert) und nicht als
# Liste, weil Coolify ueber Listeneintraege ohne Gleichheitszeichen stolpert.
services:
  botschaft:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PFAD: /daten/botschaften.db
      # Solange die Filterkette (Block 4) fehlt, geht alles direkt in die Anzeige:
      AUTO_FREIGABE: "true"
      STANDZEIT: 25
      MAX_ZEICHEN: 120
      EMPFOHLENE_ZEICHEN: 35
      MAX_VERSALHOEHE: 40
      MIN_VERSALHOEHE: 22
      # Stufe 1b. Der Schluessel steht in Coolify unter Environment Variables
      # und niemals hier - diese Datei liegt im Repository.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODELL: ${MISTRAL_MODELL:-mistral-small-2603}
      MISTRAL_ZEITLIMIT_MS: ${MISTRAL_ZEITLIMIT_MS:-3000}
      MISTRAL_PARALLEL: ${MISTRAL_PARALLEL:-4}
    volumes:
      - botschaft-daten:/daten
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/gesundheit').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  botschaft-daten:
