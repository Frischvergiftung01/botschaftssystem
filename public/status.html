<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deine Botschaft — Status</title>
<link rel="stylesheet" href="/schrift/schrift.css">
<style>
  :root{--grund:#0d0f14;--feld:#171b23;--rand:#2a3040;--text:#f2f4f8;--leise:#98a1b3;--gold:#ffcf6b;--gruen:#7ee0a8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--grund);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom))}
  .karte{width:100%;max-width:520px;background:var(--feld);border:1px solid var(--rand);
    border-radius:18px;padding:20px}
  .botschaft{font-family:Oswald,"Arial Narrow",sans-serif;font-size:1.35rem;line-height:1.3;
    word-break:break-word}
  .absender{color:var(--leise);font-size:.9rem;margin-top:6px}
  h2{font-size:1.05rem;margin:0 0 10px;font-weight:600}
  .gross{font-size:1.6rem;font-weight:650;line-height:1.2;margin:6px 0}
  .leise{color:var(--leise);font-size:.92rem;line-height:1.5;margin:0}
  .jetzt{border-color:var(--gruen);box-shadow:0 0 0 1px var(--gruen) inset}
  .jetzt .gross{color:var(--gruen)}
  .punkt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gruen);
    margin-right:8px;animation:puls 1.6s infinite}
  @keyframes puls{0%,100%{opacity:1}50%{opacity:.25}}
  a.knopf{display:block;text-align:center;background:transparent;color:var(--gold);
    border:1px solid var(--rand);border-radius:14px;padding:13px;text-decoration:none;font-weight:600}
  a.knopf.aus{color:var(--leise);pointer-events:none;opacity:.6}
  .fuss{color:#6b748b;font-size:.8rem;text-align:center;max-width:520px;line-height:1.5;margin:0}
  .balken{height:6px;background:#232a36;border-radius:99px;overflow:hidden;margin-top:12px}
  .balken div{height:100%;background:var(--gold);width:0;transition:width .6s}

  /* Der Fassadenplan. Der Umriss liegt auf der Resolume-Canvas (7680 x 1200),
     also im selben Koordinatensystem wie die Flächen — die Marke sitzt damit
     ohne Umrechnerei an der richtigen Stelle. `screen` blendet Schwarz weg;
     fehlt die Datei, bleibt es beim dunklen Grund und der Punkt steht immer
     noch richtig. */
  /* Kein eigener Rahmen mehr: der Plan sitzt in der Statuskarte. */
  .plankarte{margin:4px 0 2px}
  /* Zwei Ansichten desselben Bildes.
     Die Übersicht beantwortet "welches Ende des Gebäudes", der Ausschnitt
     "welche Säule". Auf einem Handy ist die Übersicht allein zu flach: 6,4:1
     sind bei 360 px Breite ganze 56 px Höhe — der Punkt sitzt zwar richtig,
     aber Säulen zählen kann man darin nicht. */
  .fassade{position:relative;width:100%;background:#05070a;border-radius:10px;overflow:hidden}
  .fassade::before{content:"";position:absolute;inset:0;
    background-image:url('/fassade-umriss.png');background-repeat:no-repeat;
    background-size:100% 100%;background-position:0 0;
    mix-blend-mode:screen;opacity:.5}
  .uebersicht{aspect-ratio:64/10;opacity:.75}
  /* Ein Drittel des Gebäudes: 2560 x 1200 der Canvas, also dreifach so hoch
     dargestellt wie die Übersicht. */
  .ausschnitt{aspect-ratio:64/30;margin-top:8px}
  .ausschnitt::before{background-size:300% 100%;background-position:var(--x,0) 0}
  /* Zeigt in der Übersicht, welcher Teil unten vergrößert ist. */
  .lupe{position:absolute;top:0;bottom:0;border:1px solid rgba(255,207,107,.5);
    border-radius:3px;background:rgba(255,207,107,.07);pointer-events:none}
  .fassade.jetzt .lupe{border-color:rgba(126,224,168,.5);background:rgba(126,224,168,.07)}
  /* Eine Säulenfläche ist 44 von 7680 breit — als Rechteck auf einem Handy
     wäre sie zwei Pixel schmal. Deshalb ein Punkt fester Größe auf ihrer
     Mitte: sichtbar, und die Stelle stimmt trotzdem. */
  .marke{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 0 3px rgba(255,207,107,.25),0 0 20px 5px rgba(255,207,107,.5);
    animation:puls 1.8s ease-in-out infinite}
  .ausschnitt .marke{width:18px;height:18px;margin:-9px 0 0 -9px}
  .fassade.jetzt .marke{background:var(--gruen);
    box-shadow:0 0 0 3px rgba(126,224,168,.25),0 0 20px 5px rgba(126,224,168,.55)}
  .planfuss{display:flex;gap:10px;margin:8px 2px 2px;
    color:var(--leise);font-size:.82rem}
  .planfuss b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="karte">
  <div class="botschaft" id="botschaft">…</div>
  <div class="absender" id="absender"></div>
</div>

<div class="karte" id="statuskarte">
  <h2 id="ueberschrift">Wird geprüft</h2>
  <!-- Erst das Bild, dann das Wort: in der Probe hat sich gezeigt, dass man
       zuerst hinsieht, WO es leuchtet, und die Ortsangabe danach als
       Bestätigung liest. Stand der Plan darunter in einer eigenen Karte,
       wurde er auf dem Handy leicht ganz übersehen. -->
  <div class="plankarte" id="plankarte" hidden>
    <div class="fassade uebersicht" id="uebersicht">
      <div class="lupe" id="lupe"></div>
      <div class="marke" id="marke"></div>
    </div>
    <div class="fassade ausschnitt" id="ausschnitt"><div class="marke" id="markeGross"></div></div>
    <div class="planfuss"><span id="planSeite"></span></div>
  </div>
  <p class="gross" id="kernaussage">Einen Moment …</p>
  <p class="leise" id="erklaerung"></p>
  <div class="balken"><div id="balken"></div></div>
</div>

<a class="knopf" id="weiter" href="/">Noch eine Botschaft schicken</a>
<p class="fuss">Du kannst die Seite offen lassen — sie hält sich von selbst auf dem Laufenden.
Wenn du sie schließt, findest du deine Botschaft über die Startseite wieder.<br>
<a href="/datenschutz" style="color:inherit">Datenschutz</a> ·
<a href="/impressum" style="color:inherit">Impressum</a></p>

<script>
const token = new URLSearchParams(location.search).get('t') || localStorage.getItem('token');
const el = id => document.getElementById(id);
let timer = null;

// Dieselbe Ablage wie auf der Eingabeseite: eigene Botschaften und die Wartezeit
// bis zur naechsten. Wer ueber einen Link hier landet, hat sie damit auch dort.
const LISTE = 'botschaften', SPERRE = 'sperreBis';
function eigene () { try { return JSON.parse(localStorage.getItem(LISTE) || '[]'); } catch (e) { return []; } }
if (token && !eigene().some(x => x.token === token)) {
  const liste = eigene();
  liste.unshift({ token, text: '', zeit: Date.now() });
  localStorage.setItem(LISTE, JSON.stringify(liste.slice(0, 10)));
}

// "Noch eine Botschaft" bleibt zu, solange die Gerätesperre läuft — sonst
// tippt jemand einen Text und bekommt erst beim Abschicken die Absage.
const weiter = el('weiter');
function sperreTicken () {
  const rest = Math.ceil((Number(localStorage.getItem(SPERRE) || 0) - Date.now()) / 1000);
  if (rest > 0) {
    weiter.classList.add('aus');
    weiter.textContent = `Noch eine Botschaft — in ${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, '0')}`;
  } else {
    weiter.classList.remove('aus');
    weiter.textContent = 'Noch eine Botschaft schicken';
  }
}
setInterval(sperreTicken, 1000);
sperreTicken();

if (!token) {
  el('ueberschrift').textContent = 'Keine Botschaft gefunden';
  el('kernaussage').textContent = 'Schick zuerst eine ab.';
} else {
  laden();
}

async function laden () {
  try {
    const a = await fetch('/api/status/' + encodeURIComponent(token));
    if (!a.ok) throw new Error('weg');
    zeichnen(await a.json());
  } catch (e) {
    el('erklaerung').textContent = 'Verbindung gerade schwierig — wir versuchen es weiter.';
    planen(20000);
  }
}

const CANVAS_B = 7680, CANVAS_H = 1200, BANDHOEHE = 44;
const SEITE = { links: 'linke Gebäudehälfte', rechts: 'rechte Gebäudehälfte', mitte: 'Gebäudemitte' };

const LUPE = 1 / 3;   // wie viel des Gebäudes der Ausschnitt zeigt

/** Setzt die Marke auf die Fläche — oder blendet den Plan aus. */
function planZeigen (f, laeuftGerade) {
  const karte = el('plankarte');
  if (!f || !f.fassade) { karte.hidden = true; return; }
  karte.hidden = false;

  const breit = f.fassade.gedreht ? BANDHOEHE : f.breite;
  const hoch = f.fassade.gedreht ? f.breite : BANDHOEHE;
  const x = (f.fassade.x + breit / 2) / CANVAS_B;    // 0 … 1 über die Fassade
  const y = (f.fassade.y + hoch / 2) / CANVAS_H;

  el('marke').style.left = (x * 100) + '%';
  el('marke').style.top = (y * 100) + '%';

  // Der Ausschnitt legt sich um die Marke und bleibt dabei im Gebäude: an den
  // Enden wandert nicht das Bild aus dem Rahmen, sondern die Marke aus der Mitte.
  const links = Math.max(0, Math.min(1 - LUPE, x - LUPE / 2));
  el('ausschnitt').style.setProperty('--x', (links / (1 - LUPE) * 100) + '%');
  el('markeGross').style.left = ((x - links) / LUPE * 100) + '%';
  el('markeGross').style.top = (y * 100) + '%';

  const lupe = el('lupe');
  lupe.style.left = (links * 100) + '%';
  lupe.style.width = (LUPE * 100) + '%';

  el('uebersicht').classList.toggle('jetzt', Boolean(laeuftGerade));
  el('ausschnitt').classList.toggle('jetzt', Boolean(laeuftGerade));
  // Der Ort steht gross unter dem Plan (Element `kernaussage`) — hier nur noch
  // die Gebaeudehaelfte, damit dasselbe nicht zweimal dasteht.
  el('planSeite').textContent = SEITE[f.seite] || '';
}

function dauer (sekunden) {
  const v = Math.max(0, Math.round(sekunden));
  return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
}

function zeichnen (d) {
  el('botschaft').textContent = d.text;
  const liste = eigene();
  const eintrag = liste.find(x => x.token === token);
  if (eintrag && !eintrag.text) {
    eintrag.text = d.name ? `${d.text} — ${d.name}` : d.text;
    localStorage.setItem(LISTE, JSON.stringify(liste));
  }
  el('absender').textContent = d.name ? '— ' + d.name : '';
  const karte = el('statuskarte');
  karte.classList.remove('jetzt');

  if (d.jetztAuf) {
    karte.classList.add('jetzt');
    el('ueberschrift').innerHTML = '<span class="punkt"></span>Gerade auf der Fassade';
    el('kernaussage').textContent = d.jetztAuf.ort || d.jetztAuf.name;
    el('erklaerung').textContent = 'Schau hin! Sie steht noch ein paar Sekunden.';
    el('balken').style.width = '100%';
    planZeigen(d.jetztAuf, true);
    return planen(3000);           // dicht dran: schnell nachfragen
  }

  // Gebucht: die eigentliche Ansage. Ort und Zeit, bevor es losgeht — wer am
  // falschen Ende des Gebäudes steht, hat von "läuft jetzt" nichts.
  if (d.gebucht) {
    planZeigen(d.gebucht, false);
    el('balken').style.width = Math.max(6, 100 - Math.min(100, d.gebucht.inSekunden / 1.8)) + '%';
    if (d.gebucht.inSekunden <= 25) {
      karte.classList.add('jetzt');
      el('ueberschrift').innerHTML = '<span class="punkt"></span>Gleich!';
      el('kernaussage').textContent = d.gebucht.ort;
      el('erklaerung').textContent = 'Jeden Moment — schau schon mal hin.';
      return planen(2000);
    }
    el('ueberschrift').textContent = 'In ' + dauer(d.gebucht.inSekunden);
    el('kernaussage').textContent = d.gebucht.ort;
    el('erklaerung').textContent = d.gebucht.inSekunden <= 180
      ? 'Genug Zeit, um hinzugehen. Die Seite meldet sich, wenn es so weit ist.'
      : 'Der Platz steht fest. Die Seite zählt für dich herunter.';
    return planen(d.gebucht.inSekunden <= 60 ? 3000 : 10000);
  }

  planZeigen(null);

  if (d.status === 'abgelehnt') {
    el('ueberschrift').textContent = 'Nicht freigegeben';
    el('kernaussage').textContent = 'Diese Botschaft zeigen wir nicht.';
    el('erklaerung').textContent = 'Das entscheidet ein Mensch, nicht der Computer. Schick gern eine andere.';
    el('balken').style.width = '0';
    return;                         // Endzustand, kein weiteres Nachfragen
  }

  if (d.anzahlAnzeigen > 0) {
    el('ueberschrift').textContent = 'War schon zu sehen';
    el('kernaussage').textContent = d.zuletzt ? (d.zuletzt.ort || d.zuletzt.name) : 'auf der Fassade';
    el('erklaerung').textContent = `Bisher ${d.anzahlAnzeigen}× gezeigt — sie kommt im Lauf des Abends wieder.`;
    el('balken').style.width = '100%';
    return planen(20000);
  }

  if (d.status === 'freigegeben') {
    const s = d.session || {};
    // Zwischen zwei Runden ist ein Countdown eine Lüge: es passiert nichts,
    // bis die nächste startet. Dann lieber die Uhrzeit nennen.
    if (s.phase && s.phase !== 'laeuft' && s.phase !== 'ohnePlan') {
      el('ueberschrift').textContent = 'Freigegeben';
      el('kernaussage').textContent = 'Kommt in der nächsten Runde';
      el('erklaerung').textContent = s.kommend
        ? `Die nächste beginnt gegen ${s.kommend.geplantStart}. Deine Botschaft ist dann früh dabei.`
        : 'Sobald es weitergeht, ist deine Botschaft dabei.';
      el('balken').style.width = '50%';
      return planen(15000);
    }
    const min = Math.max(1, Math.round(d.geschaetzteWartezeitSekunden / 60));
    el('ueberschrift').textContent = 'Freigegeben';
    el('kernaussage').textContent = d.vorDir === 0 ? 'Gleich geht es los' : `${d.vorDir} Botschaften vor dir`;
    el('erklaerung').textContent = d.vorDir === 0
      ? 'Deine Botschaft ist als Nächstes an der Reihe.'
      : `Das dauert schätzungsweise ${min} Minute${min === 1 ? '' : 'n'}. Sobald der Platz feststeht, sagen wir dir, wo du hinschauen musst.`;
    el('balken').style.width = Math.max(4, 100 - Math.min(100, d.vorDir * 3)) + '%';
    return planen(d.geschaetzteWartezeitSekunden < 90 ? 3000 : 15000);
  }

  el('ueberschrift').textContent = 'Wird geprüft';
  el('kernaussage').textContent = 'Kurz Geduld';
  el('erklaerung').textContent = 'Jede Botschaft schaut sich jemand an, bevor sie an die Fassade geht.';
  el('balken').style.width = '10%';
  planen(5000);
}

// Adaptives Nachfragen statt Dauerverbindung: auf vollem Platz reißen dauerhafte
// Verbindungen ständig ab, einzelne Anfragen kommen dagegen durch.
function planen (ms) { clearTimeout(timer); timer = setTimeout(laden, ms); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) laden(); });
</script>
</body>
</html>
